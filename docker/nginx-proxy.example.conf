server {
    server_name chinago.balinasoft.com;

    location / {
        proxy_pass http://192.168.0.168:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If any COEP/COOP leak from elsewhere — strip them
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chinago.balinasoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinago.balinasoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = chinago.balinasoft.com) {
        return 301 https://$host$request_uri;
    }

    server_name chinago.balinasoft.com;
    listen 80;
    return 404;
}
